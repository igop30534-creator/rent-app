function $(i){return document.getElementById(i);}

function initApp(){
  AGE.forEach((a,i)=>$("age").add(new Option(a,i)));
  onTableChange();
}

function onTableChange(){
  var t=TABLES[$("tableSelect").value];
  var d=$("district"); d.innerHTML="";
  Object.keys(t.data).forEach(k=>d.add(new Option(k,k)));
  calc();
}

function getUnit(t,a){
  var r=t.data[$("district").value];
  if(t.bands===9) return r[a]||0;
  if(a<=5) return r[a];
  if(a<=7) return r[6];
  return r[7];
}

function calc(){
  var t=TABLES[$("tableSelect").value];
  var a=$("age").selectedIndex;
  var area=+$("area").value||0;
  var m=+$("manage").value||0;
  var p=+$("parking").value||0;
  var unit=getUnit(t,a);
  var rent=Math.round(unit*area);
  $("unit").innerHTML=unit;
  $("rent").innerHTML=rent;
  $("mOut").innerHTML=m;
  $("pOut").innerHTML=p;
  $("total").innerHTML=rent+m+p;
}

function buildText(){
  return "五泰房屋｜社會住宅租金報價\n"+
    "資料表："+$("tableSelect").selectedOptions[0].text+"\n"+
    "行政區："+$("district").value+"\n"+
    "屋齡："+AGE[$("age").selectedIndex]+"\n"+
    "坪數："+$("area").value+" 坪\n"+
    "租金小計："+$("rent").innerHTML+" 元\n"+
    "管理費："+$("manage").value+" 元\n"+
    "車位費："+$("parking").value+" 元\n"+
    "總月租："+$("total").innerHTML+" 元\n"+
    "五泰房屋市場建議："+($("marketSuggest").value||"未填");
}

function copyText(){navigator.clipboard.writeText(buildText());}
function openLine(){location.href="line://msg/text/"+encodeURIComponent(buildText());}
function oneTapLine(){copyText();setTimeout(openLine,300);}

/* ===== 依你指定的「截圖內容順序」產生圖片 ===== */
function makeImage(){
  calc();
  var c=document.createElement("canvas");
  c.width=1080; c.height=1400;
  var x=c.getContext("2d");

  x.fillStyle="#fff";
  x.fillRect(0,0,1080,1400);

  x.fillStyle="#000";
  x.font="34px sans-serif";
  x.fillText("資料表："+$("tableSelect").selectedOptions[0].text,40,120);
  x.fillText("行政區："+$("district").value,40,180);
  x.fillText("屋齡："+AGE[$("age").selectedIndex],40,240);
  x.fillText("坪數："+($("area").value||0)+" 坪",40,300);

  x.fillText("租金小計："+$("rent").innerHTML+" 元",40,380);
  x.fillText("管理費："+($("manage").value||0)+" 元",40,440);
  x.fillText("車位費："+($("parking").value||0)+" 元",40,500);

  x.fillStyle="#0b5bd3";
  x.font="bold 52px sans-serif";
  x.fillText("總月租："+$("total").innerHTML+" 元",40,600);

  x.fillStyle="#000";
  x.font="bold 36px sans-serif";
  var market=$("marketSuggest").value||"未填";
  x.fillText("五泰房屋市場建議含管含車："+market+(market!=="未填"?" 元":""),40,680);

  x.fillStyle="#666";
  x.font="30px sans-serif";
  x.fillText("台北市整層戶最高39,000元；獨立套房最高24,000元",40,900);
  x.fillText("新北市整層戶最高35,000元；獨立套房最高21,000元",40,950);
  x.fillText("桃園市整層戶最高35,000元；獨立套房最高21,000元",40,1000);

  $("resultImg").src=c.toDataURL("image/jpeg",0.9);
  $("imgBox").style.display="block";
}
